name: Tapo SD player
version: "0.3.0"
slug: tapo_sd_player
description: Browse and play Tapo camera SD-card clips and live view in Home Assistant, nothing stored
url: https://github.com/ffleurey/ha-tapo-sd-player
image: ghcr.io/ffleurey/tapo-sd-player
arch: [aarch64, amd64]
ingress: true
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: Tapo SD
# direct LAN port, off by default: ingress puts HA's login in front
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Player without HA login (leave empty to keep it off)
options:
  cloud_password: ""
  live_max_minutes: 10
  turn_on_media_encryption: false
  cameras: []
schema:
  cloud_password: password
  live_max_minutes: int(1,60)
  turn_on_media_encryption: bool
  cameras:
    - name: str
      host: str
      cloud_password: password?
