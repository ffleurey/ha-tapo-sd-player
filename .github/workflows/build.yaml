# On a tag vX.Y.Z: build the app image for both HA architectures and push it to GHCR.
# The tag must match `version` in tapo_sd_player/config.yaml (HA pulls image:version).
name: build
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches config.yaml
        run: |
          v=$(sed -n 's/^version: "\(.*\)"/\1/p' tapo_sd_player/config.yaml)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, config.yaml $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: tapo_sd_player
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ffleurey/tapo-sd-player:${{ env.VERSION }}
            ghcr.io/ffleurey/tapo-sd-player:latest
          labels: |
            io.hass.type=addon
            io.hass.version=${{ env.VERSION }}
            org.opencontainers.image.source=https://github.com/ffleurey/ha-tapo-sd-player
